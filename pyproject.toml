[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nitincolors"
dynamic = ["version"]
description = "Nitin's colormap library: 980+ scientific colour tables with merge, crop, shift, discrete and level tools for Matplotlib"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "CREDITS.md", "src/nitincolors/data/ncar_ncl/Copyright"]
authors = [{ name = "Nitin Lohan" }]
dependencies = ["matplotlib>=3.6", "numpy"]
keywords = ["colormap", "colormaps", "matplotlib", "NCL", "climate", "meteorology", "visualization"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/Lohannitin/nitincolors"
Documentation = "https://lohannitin.github.io/nitincolors/"
Source = "https://github.com/Lohannitin/nitincolors"
Issues = "https://github.com/Lohannitin/nitincolors/issues"

[tool.setuptools.dynamic]
version = { attr = "nitincolors._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nitincolors = ["data/*/*.rgb", "data/*/Copyright"]

[tool.pytest.ini_options]
testpaths = ["tests"]
